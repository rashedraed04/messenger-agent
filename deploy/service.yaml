apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: messenger-agent
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: gcr.io/PROJECT_ID/messenger-agent:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_PORT
              value: "8080"
            - name: APP_BASE_URL
              value: "https://YOUR-CLOUD-RUN-URL"
            - name: FACEBOOK_PAGE_ID
              value: "1422458150947777"
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_URL
                  key: latest
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_ANON_KEY
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_SERVICE_ROLE_KEY
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: META_APP_SECRET
                  key: latest
            - name: META_PAGE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_PAGE_ACCESS_TOKEN
                  key: latest
            - name: META_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_VERIFY_TOKEN
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: TELEGRAM_BOT_TOKEN
                  key: latest
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: TELEGRAM_CHAT_ID
                  key: latest
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: INTERNAL_API_TOKEN
                  key: latest
