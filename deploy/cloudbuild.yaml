substitutions:
  # Set these on the command line, e.g.
  #   gcloud builds submit --config=deploy/cloudbuild.yaml \
  #     --substitutions=_APP_BASE_URL=https://messenger-agent-xxxxx.us-central1.run.app
  # On the very first deploy the URL is not known yet: deploy once, copy the
  # service URL, then deploy again with it.
  _REGION: us-central1
  _APP_BASE_URL: https://YOUR-CLOUD-RUN-URL
  _FACEBOOK_PAGE_ID: '1422458150947777'

steps:
  # --- Run tests ---
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest tests/ -v --tb=short

  # --- Build Docker image ---
  # $BUILD_ID is always set; $COMMIT_SHA is empty for manual `gcloud builds submit`.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/messenger-agent:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/messenger-agent:latest'
      - '.'

  # --- Push to Container Registry ---
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/messenger-agent:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/messenger-agent:latest'

  # --- Deploy to Cloud Run ---
  # Secrets come from Secret Manager (one secret per name, see README).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'messenger-agent'
      - '--image=gcr.io/$PROJECT_ID/messenger-agent:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--max-instances=3'
      - '--timeout=30s'
      - '--set-env-vars=APP_ENV=production,APP_DEBUG=false,APP_BASE_URL=${_APP_BASE_URL},FACEBOOK_PAGE_ID=${_FACEBOOK_PAGE_ID},GEMINI_MODEL=gemini-3.5-flash,WEBHOOK_ASYNC_MODE=false'
      - '--set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,META_APP_SECRET=META_APP_SECRET:latest,META_PAGE_ACCESS_TOKEN=META_PAGE_ACCESS_TOKEN:latest,META_VERIFY_TOKEN=META_VERIFY_TOKEN:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest,INTERNAL_API_TOKEN=INTERNAL_API_TOKEN:latest'

images:
  - 'gcr.io/$PROJECT_ID/messenger-agent:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/messenger-agent:latest'

timeout: '600s'
