[project]
name = "messenger-agent"
version = "0.1.0"
description = "Facebook Messenger AI sales agent for a Jordanian perfume store"
requires-python = ">=3.11"
license = {text = "Proprietary"}
# Dependencies live in requirements.txt (runtime) and requirements-dev.txt (tests, lint)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Deprecations raised inside third-party packages (supabase, starlette); our own code stays warning-free
filterwarnings = [
    "ignore:The `gotrue` package is deprecated:DeprecationWarning",
    "ignore:The `supafunc` package is deprecated:DeprecationWarning",
    "ignore:The 'timeout' parameter is deprecated:DeprecationWarning",
    "ignore:The 'verify' parameter is deprecated:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
# Long Arabic strings and prompt text read better unwrapped
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests import shared pytest fixtures and receive them as same-named arguments
"tests/*" = ["F811"]
# Adds the repo root to sys.path before importing app modules
"scripts/test_messenger_locally.py" = ["E402"]
