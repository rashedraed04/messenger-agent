# Render Blueprint — https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. Secrets (sync: false) are asked
# for once in the Render dashboard; they are never stored in this file.
services:
  - type: web
    name: messenger-agent
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Set to this service's URL after the first deploy, e.g. https://messenger-agent.onrender.com
      - key: APP_BASE_URL
        sync: false
      - key: FACEBOOK_PAGE_ID
        value: "1422458150947777"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: WEBHOOK_ASYNC_MODE
        value: "false"
      - key: ENABLE_TYPING_DELAY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
