# Render Blueprint — https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. Secrets (sync: false) are asked
# for once in the Render dashboard; they are never stored in this file.
services:
  - type: web
    name: messenger-agent
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --forwarded-allow-ips="*" trusts Render's proxy headers so redirects and
    # url_for() links stay on https:// behind its load balancer
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      # Set to this service's URL after the first deploy, e.g. https://messenger-agent.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Numeric ID of the Facebook Page customers message (used for m.me links)
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ENABLE_TYPING_DELAY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Render generates a random value; copy it into the cron-job.org report job header
      - key: INTERNAL_API_TOKEN
        generateValue: true
